<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Sign in – Passport York</title></head><body><div class="prototype-bar"><div class="bar-inner"><span class="prototype-label">Journey prototype</span><a href="index.html">All journeys</a></div></div><main class="site-shell"><div class="auth-wrap"><header class="brand"><img src="assets/york-logo.png" alt="York University"><h1>Sign in to Passport York</h1></header><section class="card">
<form data-login-form>
  <div class="field"><label for="signin-username">Username</label><input id="signin-username" name="username" type="text" autocomplete="username" required></div>
  <div class="field"><div class="label-row"><label for="signin-password">Password</label><button type="button" class="show-btn" data-show-password="signin-password">Show password</button></div><input id="signin-password" name="password" type="password" autocomplete="current-password" required></div>

</form>
<section class="recovery-block" aria-labelledby="trouble"><h2 id="trouble">Having trouble signing in?</h2><div class="links"><a href="password-reset.html" data-preserve-flow>Forgot my password</a><a href="update-recovery-email-1.html" data-preserve-flow>Update recovery email</a></div></section>
<section class="help-block" aria-labelledby="need-help"><h2 id="need-help">Need help?</h2><div class="help-links"><a href="#">Student login help</a><a href="#">Faculty &amp; staff login help</a><a href="mailto:askit@yorku.ca">Contact IT Support</a></div></section>
</section></div></main><script src="app.js"></script></body></html>
