<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><title>Choose new password – Passport York</title></head><body><div class="prototype-bar"><div class="bar-inner"><span class="prototype-label">Journey prototype</span><a href="index.html">All journeys</a></div></div><main class="site-shell"><div class="auth-wrap"><header class="brand"><img src="assets/york-logo.png" alt="York University"><h1>Choose New Password</h1></header><section class="card"><p class="lead">Create a password that meets the requirements below. You'll use it the next time you sign in to Passport York.</p>
<form data-new-password-form>
<div class="field"><div class="label-row"><label for="new-password">New password</label><button type="button" class="show-btn" data-show-password="new-password">Show password</button></div><input id="new-password" type="password" autocomplete="new-password" required><ul class="rule-list"><li>At least 16 characters</li><li>One number</li><li>One special character</li><li>One uppercase letter</li></ul></div>
<div class="field"><div class="label-row"><label for="confirm-password">Confirm new password</label><button type="button" class="show-btn" data-show-password="confirm-password">Show password</button></div><input id="confirm-password" type="password" autocomplete="new-password" required><span id="password-match-error" class="hint" style="color:var(--danger)" hidden>Passwords do not match.</span></div>
<div class="actions"><button class="btn btn-primary" type="submit">RESET PASSWORD</button><a class="btn btn-dark" href="login.html" data-preserve-flow>CANCEL</a></div></form></section></div></main><script src="app.js"></script></body></html>
